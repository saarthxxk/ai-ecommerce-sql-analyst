services:
  postgres:
    image: postgres:16
    container_name: ai-sql-analyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Match this to PG_SUPERUSER_PASSWORD in your .env when using this
      # container as the bootstrap target instead of a local install.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_sql_analyst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_sql_analyst_pgdata:
